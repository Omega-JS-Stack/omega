# GENERATED by `omega setup` for apps/website — do not edit.
# GitHub runs workflows from the repo root only, so this brand's per-app CI
# lives here and every step after the checkout runs in apps/website. Change the
# app's config (or the framework template) and re-run setup; this file is
# rewritten from scratch.
# Ruby-free CI — @omega.js/web replaces the Jekyll pipeline: no Ruby, no
# bundler, no Gemfile. Node + `omega build` is the whole toolchain.
# Regenerated by `omega setup` — customize via config/omega.json5, not here.
#
# Deliberate deploys (D13): commits never auto-publish — save = commit,
# publish = an explicit dispatch (`omega deploy`, the CMS publish action, or
# a plain HTTP workflow_dispatch/repository_dispatch call).
name: Compile and Build Site (apps/website)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [omega-deploy]

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  NODE_VERSION: '24'
  NODE_ENV: 'production'
  # Generated from the brand's .env cascade by `omega setup` — one line per
  # published Actions secret. Regenerated every setup; edit .env, not this.
  ACCOUNT_PASSWORD_SEED: ${{ secrets.ACCOUNT_PASSWORD_SEED }}
  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
  CHATSY_SERVICE_ACCOUNT: ${{ secrets.CHATSY_SERVICE_ACCOUNT }}
  CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
  NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
  OMEGA_ADMIN_KEY: ${{ secrets.OMEGA_ADMIN_KEY }}
  OMEGA_FONTAWESOME_ROOT: ${{ secrets.OMEGA_FONTAWESOME_ROOT }}
  OMEGA_NAMESPACE: ${{ secrets.OMEGA_NAMESPACE }}
  OMEGA_WEBHOOK_KEY: ${{ secrets.OMEGA_WEBHOOK_KEY }}
  PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
  RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
  REPLYIFY_SERVICE_ACCOUNT: ${{ secrets.REPLYIFY_SERVICE_ACCOUNT }}
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SERVER_SERVICE_ACCOUNT: ${{ secrets.SERVER_SERVICE_ACCOUNT }}
  SLAPFORM_SERVICE_ACCOUNT: ${{ secrets.SLAPFORM_SERVICE_ACCOUNT }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Socket Firewall
        working-directory: apps/website
        run: npm install -g sfw

      - name: Run node install
        working-directory: apps/website
        run: |
          for attempt in 1 2 3; do
            echo "Install attempt $attempt of 3 (sfw)..."
            sfw npm install && break
            echo "Attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "⚠ All sfw attempts failed, falling back to plain npm install"
              npm install
            fi
            sleep 15
          done

      - name: Log versions
        working-directory: apps/website
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Omega: $(npx omega version)"

      # Optimized-image cache (the cache-uj-imagemin branch successor):
      # content-addressed, reproducible binaries — never committed. An exact
      # key hit skips all image processing; a prefix hit re-processes only
      # changed images.
      - name: Restore optimized-image cache
        uses: actions/cache@v4
        with:
          path: apps/website/.omega/cache/imagemin
          key: omega-imagemin-${{ hashFiles('apps/website/src/assets/images/**') }}
          restore-keys: |
            omega-imagemin-

      - name: Build
        working-directory: apps/website
        run: |
          npx omega setup && npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: apps/website/dist

      # Post-publish edge-cache purge — runs only when the repo has a
      # CLOUDFLARE_TOKEN secret; skips silently otherwise.
      - name: Purge Cloudflare cache
        if: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        working-directory: apps/website
        run: npx omega purge
