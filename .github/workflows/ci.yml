name: CI

# ALL CI is opt-in for now (Ian 2026-07-10): the private-repo free tier's
# runner minutes were draining fast under frequent pushes, and every checkpoint
# already runs the full suites locally — CI is a deliberate safety net here,
# not the primary verification. The ONLY trigger is manual dispatch, which runs
# EVERY job (lean matrix + pack-smoke + both emulator jobs):
#   gh workflow run CI -R Omega-JS-Stack/omega
# To flip per-push verification back on later: uncomment push/pull_request
# below — the emulator jobs stay dispatch-only via their `if:` gates, so pushes
# get the lean matrix (~15 runner-minutes) and dispatch gets everything.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

# A newer push supersedes the running verification of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package suites
    runs-on: ubuntu-latest
    # Runner-minute control (Ian 2026-07-10): this is the LEAN matrix — the
    # backend emulator suite lives in its own manual-dispatch job below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: devkit suite
        run: npm test --workspace=packages/devkit

      - name: manager suite (service-runner contract + brand loading + external-service reconciliation suites + e2e manage over fixture brands)
        run: npm test --workspace=packages/manager

      - name: account suite (incl. golden master vs live @omega.js/backend user.js)
        run: npm test --workspace=packages/account

      - name: config suite
        run: npm test --workspace=packages/config

      - name: template-kit suite (incl. registerLiquid vs real liquidjs)
        run: npm test --workspace=packages/template-kit

      - name: web suite (engine core + real-layout ports + asset pipeline/ESM boot + CLI/scaffold + migrate codemod/lint + theme contract vs real Eleventy 3)
        run: npm test --workspace=packages/web

      - name: bakeoff-shared suite (corpus generator)
        run: npm test --workspace=spikes/bakeoff-shared

      - name: bakeoff-astro suite (retained reference implementation vs real Astro 5)
        run: npm test --workspace=spikes/bakeoff-astro

      - name: client suite
        run: npm test --workspace=packages/client

      - name: extension suite
        run: npm test --workspace=packages/extension

      - name: desktop suite (xvfb for Electron)
        run: xvfb-run --auto-servernum npm test --workspace=packages/desktop

  # Runner-minute control (Ian 2026-07-10): the two emulator workloads burned
  # 20–50 min per push while hanging (run-6 evidence: the runner is CLEAN going
  # in — 6.9 GB free — then functions workers fail to LOAD under the event
  # storms on 2-core runners, the emulator respawns them, and the job hangs or
  # the runner VM dies). Manual dispatch only until the fix is proven:
  #   gh workflow run CI -R Omega-JS-Stack/omega
  backend-suite:
    name: Backend suite (emulators — manual dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Run-6 evidence: 104× "Failed to load function." — functions workers time
      # out REQUIRING the heavy module on the 2-core runner (fine locally). Give
      # the emulator's codebase load a longer leash.
      FUNCTIONS_DISCOVERY_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The suite boots the Firebase emulators (firestore/database/pubsub need a JRE)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The suite spawns the `firebase` CLI to boot the emulators — not a
      # package dependency, so the runner needs it globally (same as a dev machine).
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.22.4

      - name: Install
        run: npm ci

      - name: Headroom baseline
        run: |
          free -m
          ps aux --sort=-rss | head -12

      - name: backend suite
        run: npm test --workspace=packages/backend

      # Catch the resource spike in the act — the baseline only shows the
      # BEFORE picture; if the worker-respawn spiral eats the memory, this
      # shows it (when the step fails but the runner survives).
      - name: Post-mortem headroom
        if: failure()
        run: |
          free -m
          ps aux --sort=-rss | head -15

  sandbox:
    name: Sandbox brand (@omega.js/backend corpus + cross-stack e2e — manual dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Same worker-load-timeout leash as the backend-suite job (run-6 evidence there)
      FUNCTIONS_DISCOVERY_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The sandbox backend runs the full Firebase emulator suite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The sandbox spawns the `firebase` CLI for the emulators — global, like a dev machine.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.22.4

      - name: Install
        run: npm ci

      # npm's script-approval gating skips puppeteer's postinstall (its Chrome download)
      # on the runner, so fetch the browser explicitly via puppeteer's own CLI.
      - name: Install puppeteer browser
        working-directory: apps/sandbox-brand
        run: npx puppeteer browsers install chrome

      # functions/ is a standalone install (not a workspace) — it owns its own lockfile,
      # with @omega.js/backend linked via file: to packages/backend
      - name: Sandbox backend deps
        working-directory: apps/sandbox-brand/apps/backend/functions
        run: npm ci

      # Runner headroom snapshot — the corpus keeps dying runner-level on CI
      # (suspected memory exhaustion); this makes the next death diagnosable.
      - name: Show runner headroom
        run: |
          free -m
          nproc

      # Full @omega.js/backend corpus (routes/events/rules/email/mcp) against the fresh consumer
      - name: Sandbox backend corpus
        working-directory: apps/sandbox-brand
        run: npm run test:backend

      # Real stack, real browser: emulator + built website (@omega.js/client bundle) +
      # puppeteer signup → @omega.js/backend onCreate → signin → session persistence → subscription
      - name: Cross-stack e2e
        working-directory: apps/sandbox-brand
        run: npm test

      # Catch the resource spike in the act (see the suites job's twin step)
      - name: Post-mortem headroom
        if: failure()
        run: |
          free -m
          ps aux --sort=-rss | head -15

  pack-smoke:
    name: Pack → scratch-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Catches phantom-dependency/hoisting bugs: each package must install and load
      # from its packed tarball in a bare consumer, exactly like a real npm install.
      # Also the self-containment gate for @omega.js vendoring: shipped dist must
      # contain zero raw requires OR imports of the PRIVATE @omega.js packages
      # (devkit/config/account — the vendor after-hook rewrites them to relative
      # paths; see packages/devkit/tools/vendor.js). Published @omega.js runtime
      # deps (e.g. @omega.js/client) legitimately stay as package requires — the
      # scratch install maps them to their local tarballs via overrides until
      # they exist on npm.
      - name: Pack and scratch-install each package
        run: |
          set -euo pipefail
          client_tarball=$(npm pack --workspace=packages/client --pack-destination /tmp | tail -1)
          for pkg in backend client extension desktop; do
            echo "=== $pkg ==="
            tarball=$(npm pack --workspace=packages/$pkg --pack-destination /tmp | tail -1)
            scratch=$(mktemp -d)
            name=$(node -p "require('./packages/$pkg/package.json').name")
            (cd "$scratch" \
              && npm init -y >/dev/null \
              && if [ "$pkg" != "client" ]; then node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                p.overrides = { '@omega.js/client': 'file:/tmp/$client_tarball' };
                fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
              "; fi \
              && npm install --no-audit --no-fund "/tmp/$tarball")
            (cd "$scratch" && node -e "require.resolve('$name'); console.log('$name: resolves OK')")
            if grep -rE "(require(\.resolve)?\(|from |import\(|import )['\"]@omega\.js/(devkit|config|account)" "$scratch/node_modules/$name/dist"; then
              echo "FAIL: $name ships raw private @omega.js references — vendoring did not run/rewrite"
              exit 1
            fi
            echo "$name: shipped dist is self-contained (no raw private @omega.js references)"
          done
