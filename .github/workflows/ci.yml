name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Package suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # @omega.js/backend's suite boots the Firebase emulators (firestore/database/pubsub need a JRE)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The backend suite spawns the `firebase` CLI to boot the emulators — not a
      # package dependency, so the runner needs it globally (same as a dev machine).
      - name: Install firebase-tools
        run: npm install -g firebase-tools@^15

      - name: Install
        run: npm ci

      - name: devkit suite
        run: npm test --workspace=packages/devkit

      - name: manager suite (service-runner contract + brand loading + external-service reconciliation suites + e2e manage over fixture brands)
        run: npm test --workspace=packages/manager

      - name: account suite (incl. golden master vs live @omega.js/backend user.js)
        run: npm test --workspace=packages/account

      - name: config suite
        run: npm test --workspace=packages/config

      - name: template-kit suite (incl. registerLiquid vs real liquidjs)
        run: npm test --workspace=packages/template-kit

      - name: web suite (engine core + real-layout ports + asset pipeline/ESM boot + CLI/scaffold + migrate codemod/lint + theme contract vs real Eleventy 3)
        run: npm test --workspace=packages/web

      - name: bakeoff-shared suite (corpus generator)
        run: npm test --workspace=spikes/bakeoff-shared

      - name: bakeoff-astro suite (retained reference implementation vs real Astro 5)
        run: npm test --workspace=spikes/bakeoff-astro

      - name: client suite
        run: npm test --workspace=packages/client

      - name: extension suite
        run: npm test --workspace=packages/extension

      - name: desktop suite (xvfb for Electron)
        run: xvfb-run --auto-servernum npm test --workspace=packages/desktop

      - name: backend suite
        run: npm test --workspace=packages/backend

  sandbox:
    name: Sandbox brand (@omega.js/backend corpus + cross-stack e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The sandbox backend runs the full Firebase emulator suite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The sandbox spawns the `firebase` CLI for the emulators — global, like a dev machine.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@^15

      - name: Install
        run: npm ci

      # npm's script-approval gating skips puppeteer's postinstall (its Chrome download)
      # on the runner, so fetch the browser explicitly via puppeteer's own CLI.
      - name: Install puppeteer browser
        working-directory: apps/sandbox-brand
        run: npx puppeteer browsers install chrome

      # functions/ is a standalone install (not a workspace) — it owns its own lockfile,
      # with @omega.js/backend linked via file: to packages/backend
      - name: Sandbox backend deps
        working-directory: apps/sandbox-brand/apps/backend/functions
        run: npm ci

      # Full @omega.js/backend corpus (routes/events/rules/email/mcp) against the fresh consumer
      - name: Sandbox backend corpus
        working-directory: apps/sandbox-brand
        run: npm run test:backend

      # Real stack, real browser: emulator + built website (@omega.js/client bundle) +
      # puppeteer signup → @omega.js/backend onCreate → signin → session persistence → subscription
      - name: Cross-stack e2e
        working-directory: apps/sandbox-brand
        run: npm test

  pack-smoke:
    name: Pack → scratch-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Catches phantom-dependency/hoisting bugs: each package must install and load
      # from its packed tarball in a bare consumer, exactly like a real npm install.
      # Also the self-containment gate for @omega.js vendoring: shipped dist must
      # contain zero raw requires OR imports of the PRIVATE @omega.js packages
      # (devkit/config/account — the vendor after-hook rewrites them to relative
      # paths; see packages/devkit/tools/vendor.js). Published @omega.js runtime
      # deps (e.g. @omega.js/client) legitimately stay as package requires — the
      # scratch install maps them to their local tarballs via overrides until
      # they exist on npm.
      - name: Pack and scratch-install each package
        run: |
          set -euo pipefail
          client_tarball=$(npm pack --workspace=packages/client --pack-destination /tmp | tail -1)
          for pkg in backend client extension desktop; do
            echo "=== $pkg ==="
            tarball=$(npm pack --workspace=packages/$pkg --pack-destination /tmp | tail -1)
            scratch=$(mktemp -d)
            name=$(node -p "require('./packages/$pkg/package.json').name")
            (cd "$scratch" \
              && npm init -y >/dev/null \
              && if [ "$pkg" != "client" ]; then node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                p.overrides = { '@omega.js/client': 'file:/tmp/$client_tarball' };
                fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
              "; fi \
              && npm install --no-audit --no-fund "/tmp/$tarball")
            (cd "$scratch" && node -e "require.resolve('$name'); console.log('$name: resolves OK')")
            if grep -rE "(require(\.resolve)?\(|from |import\(|import )['\"]@omega\.js/(devkit|config|account)" "$scratch/node_modules/$name/dist"; then
              echo "FAIL: $name ships raw private @omega.js references — vendoring did not run/rewrite"
              exit 1
            fi
            echo "$name: shipped dist is self-contained (no raw private @omega.js references)"
          done
