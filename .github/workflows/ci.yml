name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Package suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # BEM's suite boots the Firebase emulators (firestore/database/pubsub need a JRE)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: devkit suite
        run: npm test --workspace=packages/devkit

      - name: account suite (incl. golden master vs live BEM user.js)
        run: npm test --workspace=packages/account

      - name: config suite
        run: npm test --workspace=packages/config

      - name: template-kit suite (incl. registerLiquid vs real liquidjs)
        run: npm test --workspace=packages/template-kit

      - name: bakeoff-shared suite (corpus generator)
        run: npm test --workspace=spikes/bakeoff-shared

      - name: bakeoff-eleventy suite (A1 slice vs real Eleventy 3)
        run: npm test --workspace=spikes/bakeoff-eleventy

      - name: client suite
        run: npm test --workspace=packages/client

      - name: extension suite
        run: npm test --workspace=packages/extension

      - name: desktop suite (xvfb for Electron)
        run: xvfb-run --auto-servernum npm test --workspace=packages/desktop

      - name: backend suite
        run: npm test --workspace=packages/backend

  sandbox:
    name: Sandbox brand (BEM corpus + cross-stack e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The sandbox backend runs the full Firebase emulator suite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      # functions/ is a standalone install (not a workspace) — it owns its own lockfile,
      # with backend-manager linked via file: to packages/backend
      - name: Sandbox backend deps
        working-directory: apps/sandbox-brand/apps/backend/functions
        run: npm ci

      # Full BEM corpus (routes/events/rules/email/mcp) against the fresh consumer
      - name: Sandbox backend corpus
        working-directory: apps/sandbox-brand
        run: npm run test:backend

      # Real stack, real browser: emulator + built website (web-manager bundle) +
      # puppeteer signup → BEM onCreate → signin → session persistence → subscription
      - name: Cross-stack e2e
        working-directory: apps/sandbox-brand
        run: npm test

  pack-smoke:
    name: Pack → scratch-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Catches phantom-dependency/hoisting bugs: each package must install and load
      # from its packed tarball in a bare consumer, exactly like a real npm install.
      # Also the self-containment gate for @omegajs vendoring (devkit, account, ...):
      # shipped dist must contain zero raw requires OR imports of private @omegajs
      # packages (the vendor after-hook rewrites them to relative paths — see
      # packages/devkit/tools/vendor.js).
      - name: Pack and scratch-install each package
        run: |
          set -euo pipefail
          for pkg in backend client extension desktop; do
            echo "=== $pkg ==="
            tarball=$(npm pack --workspace=packages/$pkg --pack-destination /tmp | tail -1)
            scratch=$(mktemp -d)
            (cd "$scratch" && npm init -y >/dev/null && npm install --no-audit --no-fund "/tmp/$tarball")
            name=$(node -p "require('./packages/$pkg/package.json').name")
            (cd "$scratch" && node -e "require.resolve('$name'); console.log('$name: resolves OK')")
            if grep -rE "(require(\.resolve)?\(|from |import\(|import )['\"]@omegajs" "$scratch/node_modules/$name/dist"; then
              echo "FAIL: $name ships raw @omegajs references — vendoring did not run/rewrite"
              exit 1
            fi
            echo "$name: shipped dist is self-contained (no raw @omegajs references)"
          done
