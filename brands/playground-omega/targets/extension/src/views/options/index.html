<!--
  Surface: the options page (one setting, in the extension's own store)
  Doc: node_modules/@omega.js/extension/docs/extension.md
-->
<div class="options-container p-4">
  <h1 class="h2 mb-4">Settings</h1>

  <section class="settings-section mb-4">
    <h2 class="h5 mb-3">Notes</h2>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="auto-save-selection" disabled>
      <label class="form-check-label" for="auto-save-selection">Offer to save selected text as a note on the {{ brand.name }} site</label>
    </div>
    <p id="auto-save-status" class="text-muted small mt-2 mb-0" aria-live="polite"></p>
  </section>
</div>
