<!--
  Surface: the popup view (data-omega-bind, the auth-button classes)
  Doc: node_modules/@omega.js/extension/docs/auth.md
-->
<div class="popup-container p-3">
  <h1 class="h5 mb-3">{{ brand.name }}</h1>

  <div id="popup-signed-out" data-omega-bind="@show !auth.user.authenticated" hidden>
    <p class="text-muted mb-3">Sign in to keep notes from any tab.</p>
    <button type="button" class="btn btn-primary w-100 omega-signin">Sign in</button>
  </div>

  <div id="popup-signed-in" data-omega-bind="@show auth.user.authenticated" hidden>
    <p class="mb-1">Signed in as <strong data-omega-bind="@text auth.user.profile.displayName"></strong></p>
    <p class="text-muted mb-3"><span id="notes-count" data-omega-bind="@text notes.count"></span> notes</p>
    <button type="button" class="btn btn-primary w-100 mb-2" id="open-notes">Open notes</button>
    <button type="button" class="btn btn-outline-secondary w-100 omega-signout">Sign out</button>
  </div>
</div>
