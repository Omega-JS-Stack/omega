<!--
  Surface: the settings window's view (one notes setting)
  Doc: node_modules/@omega.js/desktop/docs/windows.md
-->
<main class="container py-4">
  <h1 class="h3 mb-4">Settings</h1>

  <section class="mb-4">
    <h2 class="h5 mb-3">Notes</h2>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="confirm-delete">
      <label class="form-check-label" for="confirm-delete">Ask before deleting a note</label>
    </div>
    <p id="confirm-delete-status" class="text-muted small mt-2 mb-0" aria-live="polite"></p>
  </section>
</main>
