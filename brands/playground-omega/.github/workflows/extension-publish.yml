# GENERATED by the targets/extension framework scaffold — do not edit.
# GitHub runs workflows from the repo root only, so this brand's per-target CI
# lives here and every step after the checkout runs in targets/extension. Change the
# target's config (or the framework template) and run any omega verb; this file is
# rewritten from scratch.
# Deliberate deploys (D13): commits never auto-publish — save = commit,
# publish = an explicit dispatch (`omega deploy`, the CMS publish action, or
# a plain HTTP workflow_dispatch call).
# Regenerated by every verb's ensureTarget: customize via config/omega.json5, not here.
name: Build and Publish Extension (targets/extension)

on:
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  OMEGA_BUILD_MODE: 'true'
  OMEGA_IS_PUBLISH: 'true'

  # The brand's cross-repo token, never `secrets.GITHUB_TOKEN`: the publish
  # uploads its zips to the brand's `<brand.id>-releases` repo (#883), which is
  # not the repo this workflow runs in, and a run-scoped token cannot reach it.
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # Every CI-delivered key of the env schema, GENERATED (#627): one
  # `KEY: ${{ secrets.KEY }}` line per `delivery: { extension: 'ci' | 'bake' }`
  # entry (@omega.js/config's env-delivery.js), re-rendered by every verb's
  # scaffold. A dispatched run has no `.env`, so this block is the ONLY way the
  # store credentials and the Measurement Protocol secret the build bakes into
  # every bundle (OMEGA_BUILD_JSON) reach the runner. Add a key to the schema, not to this file.
  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
  EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
  EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
  FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
  FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
  GOOGLE_ANALYTICS_SECRET: ${{ secrets.GOOGLE_ANALYTICS_SECRET }}
  OMEGA_LICENSE_KEY: ${{ secrets.OMEGA_LICENSE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"

      # Shallow on purpose: the build reads `git config` and runs
      # `git archive HEAD`, both answered by a depth-1 clone. Nothing in an
      # extension build reads git HISTORY.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The firewall binary comes through Socket's own action (#871): it downloads
      # with the job's token, so the shared anonymous GitHub API quota of a hosted
      # runner never fails the step, and it caches the binary between runs.
      - name: Install Socket Firewall
        id: omega-firewall
        uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - name: Expose Socket Firewall to cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: targets/extension
        run: copy "${{ steps.omega-firewall.outputs.firewall-path-binary }}" "${{ steps.omega-firewall.outputs.firewall-path-binary }}.exe"

      - name: Install dependencies
        working-directory: targets/extension
        run: sfw npm install --workspace .

      # No npx on a runner, in any spelling (#877): which package won npm's
      # shared `omega` bin link is an install-order accident, and an `npx omega`
      # that finds nothing linked fetches a stranger's package from the REGISTRY
      # with every secret in the job env. This workflow belongs to exactly one
      # framework, so it runs that framework's own bin FILE. The path is
      # anchored at the workspace root: npm hoists a workspace's dependencies
      # there, where a target-scoped `./node_modules` never sees them (#898).
      - name: Log dependency versions
        working-directory: targets/extension
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Framework: $(node "${{ github.workspace }}/node_modules/@omega.js/extension/bin/omega" version)"
          echo ""
          echo "NPM Dependencies:"
          npm list --depth=0 || echo ""

      # The publish task does the store uploads AND the GitHub release (#883):
      # the release lives in node, against the derived `<brand.id>-releases`
      # repo, so this workflow types no repo name and a laptop publish uploads
      # the same assets to the same tag.
      - name: Build and publish extension
        working-directory: targets/extension
        run: |
          npm run build
