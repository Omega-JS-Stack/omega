# GENERATED by the targets/backend framework scaffold — do not edit.
# GitHub runs workflows from the repo root only, so this brand's per-target CI
# lives here and every step after the checkout runs in targets/backend. Change the
# target's config (or the framework template) and run any omega verb; this file is
# rewritten from scratch.
# Deliberate deploys (D13): commits never auto-publish, save = commit and
# publish = an explicit dispatch (`omega deploy`, or a plain HTTP
# workflow_dispatch/repository_dispatch call).
# Regenerated by every verb's ensureTarget: customize via config/omega.json5, not here.
name: Deploy Backend (targets/backend)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [omega-deploy]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # The two workflow-owned names (the generated block below never restates a
  # key the template already declares, and a repeated YAML mapping key is
  # invalid). Both are backend runtime keys, so both ride into the .env below.
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
  NODE_VERSION: '22'
  # No NODE_ENV here, deliberately (#872): npm skips devDependencies under
  # `NODE_ENV=production`, so the install below left the brand's own
  # @omega.js/manager and every framework declared as a devDependency off the
  # runner, and the first run hung 30 minutes on a bin that did not exist. The
  # deploy never reads it: `ensureStaged` composes the production env from its
  # own `environment: 'production'` option, not from the ambient value.

  # Generated from the env schema's backend deliveries (#627, #872): one line
  # per key, injected here and written back into the target's .env below. A
  # dispatched run has no brand checkout to compose that file from, so this
  # block is the only way a runtime key reaches the functions upload.
  # Regenerated by every verb's ensureTarget; edit .env, not this.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
  CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
  COINBASE_COMMERCE_API_KEY: ${{ secrets.COINBASE_COMMERCE_API_KEY }}
  GOOGLE_ANALYTICS_SECRET: ${{ secrets.GOOGLE_ANALYTICS_SECRET }}
  HCAPTCHA_SECRET: ${{ secrets.HCAPTCHA_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  NEVERBOUNCE_API_KEY: ${{ secrets.NEVERBOUNCE_API_KEY }}
  OMEGA_ADMIN_KEY: ${{ secrets.OMEGA_ADMIN_KEY }}
  OMEGA_LICENSE_KEY: ${{ secrets.OMEGA_LICENSE_KEY }}
  OMEGA_NAMESPACE: ${{ secrets.OMEGA_NAMESPACE }}
  OMEGA_SERVICE_ACCOUNT_JSON: ${{ secrets.OMEGA_SERVICE_ACCOUNT_JSON }}
  OMEGA_TEST_FIREBASE_ADMIN_KEY: ${{ secrets.OMEGA_TEST_FIREBASE_ADMIN_KEY }}
  OMEGA_TEST_USER_UID: ${{ secrets.OMEGA_TEST_USER_UID }}
  OMEGA_WEBHOOK_KEY: ${{ secrets.OMEGA_WEBHOOK_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
  UNSUBSCRIBE_HMAC_KEY: ${{ secrets.UNSUBSCRIBE_HMAC_KEY }}
  ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Shallow on purpose: nothing in a backend deploy reads git HISTORY.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The firewall binary comes through Socket's own action (#871): it downloads
      # with the job's token, so the shared anonymous GitHub API quota of a hosted
      # runner never fails the step, and it caches the binary between runs.
      - name: Install Socket Firewall
        id: omega-firewall
        uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - name: Expose Socket Firewall to cmd (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: targets/backend
        run: copy "${{ steps.omega-firewall.outputs.firewall-path-binary }}" "${{ steps.omega-firewall.outputs.firewall-path-binary }}.exe"

      - name: Install dependencies
        working-directory: targets/backend
        run: sfw npm install

      # Never bare `npx omega` on a runner: a missing bin makes npx fetch a
      # stranger's package with the secrets in env (#872). The framework's own
      # bin is unambiguous here (this workflow belongs to exactly one
      # framework), and `--no-install` turns a missing one into a loud failure.
      - name: Log versions
        working-directory: targets/backend
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Omega: $(npx --no-install omega-backend version)"

      # The target's own .env, rebuilt from the runner env: it is the LOCAL
      # layer of the cascade the deploy composes dist/.env from, and the runner
      # has no brand root to read one from. The KEY LIST is GENERATED from the
      # same schema the env block above is (#872), so the two can never
      # disagree, and the file is written by node through @omega.js/config's own
      # serializer: the heredoc of `KEY="$VALUE"` lines this replaced split its
      # own line the moment a secret carried a newline, and everything after it
      # parsed as a key of its own. Runs after the install, so the require
      # resolves through the backend this target just installed.
      - name: Write the target .env
        working-directory: targets/backend
        run: |
          node -e '
            const { serializeEnv } = require("@omega.js/backend/dist/vendor/config/env.js");
            const values = {};
            for (const key of ["ANTHROPIC_API_KEY","BEEHIIV_API_KEY","CHARGEBEE_API_KEY","CLOUDFLARE_TOKEN","COINBASE_COMMERCE_API_KEY","GH_TOKEN","GOOGLE_ANALYTICS_SECRET","HCAPTCHA_SECRET","META_ACCESS_TOKEN","NEVERBOUNCE_API_KEY","OMEGA_ADMIN_KEY","OMEGA_NAMESPACE","OMEGA_TEST_FIREBASE_ADMIN_KEY","OMEGA_TEST_USER_UID","OMEGA_WEBHOOK_KEY","OPENAI_API_KEY","PAYPAL_CLIENT_SECRET","RECAPTCHA_SECRET_KEY","SENDGRID_API_KEY","STRIPE_SECRET_KEY","TIKTOK_ACCESS_TOKEN","UNSUBSCRIBE_HMAC_KEY","ZEROBOUNCE_API_KEY"]) {
              if (process.env[key]) values[key] = process.env[key];
            }
            require("fs").writeFileSync(".env", serializeEnv(values));
            console.log("Wrote .env with " + Object.keys(values).length + " keys");
          '

      # The deploy credential, back to the path the authored chain names (the
      # same file `omega build` stages into dist/ and `firebase deploy`
      # authenticates with through GOOGLE_APPLICATION_CREDENTIALS).
      - name: Write the service account
        working-directory: targets/backend
        run: |
          printf '%s' "$OMEGA_SERVICE_ACCOUNT_JSON" > service-account.json

      # `firebase deploy` authenticates with the key file written above, but the
      # public-invoker step of the deploy shells out to `gcloud`, which reads
      # its OWN credential store and ignores GOOGLE_APPLICATION_CREDENTIALS: on
      # a runner that never activated an account, every HTTP function ships
      # without its allUsers invoker binding and answers 403 (#872). The Cloud
      # SDK is preinstalled on ubuntu-latest, so activating the same service
      # account is the whole step. The PROJECT stays implicit: every gcloud call
      # the deploy makes passes its own `--project`, derived at run time from
      # the resolved cloud.config.projectId.
      - name: Authenticate gcloud
        working-directory: targets/backend
        run: gcloud auth activate-service-account --key-file "$PWD/service-account.json"

      # The verb shells out to the Firebase CLI, a GLOBAL install on a laptop
      # (firebase-tools is not a dependency of the framework, on purpose: it is
      # the developer's tool, not the artifact's). A runner starts without it,
      # so the workflow installs it here, through the firewall, pinned to the
      # major the framework is proven against.
      - name: Install Firebase CLI
        working-directory: targets/backend
        run: sfw npm install -g firebase-tools@15

      # The deploy itself is this framework's own verb, the same one a laptop
      # runs: license verdict, stage, local-package staging, `firebase deploy`,
      # public-invoker IAM.
      - name: Deploy
        working-directory: targets/backend
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
          npx --no-install omega-backend deploy --direct
