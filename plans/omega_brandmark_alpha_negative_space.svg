<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(225, 222, 219);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">OMEGA brandmark, negative space concept</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(225, 222, 219);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A solid black omega symbol whose opening between the feet forms a hidden upward triangle, evoking the letter alpha.</desc><path fill-rule="evenodd" fill="var(--text-primary)" d="M 235 240 L 235 208 L 298.8 208 A 90 90 0 1 1 381.2 208 L 445 208 L 445 240 L 358 240 L 340 200 L 322 240 Z M 388 128 A 48 48 0 1 1 292 128 A 48 48 0 1 1 388 128 Z" data-darkreader-inline-fill="" style="--darkreader-inline-fill: var(--darkreader-bg--text-primary, var(--darkreader-background-ffffff, #181a1b));;fill:rgb(11, 11, 11);stroke:none;color:rgb(225, 222, 219);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/></svg>