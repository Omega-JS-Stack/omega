<style>
  .hero-demo-stat-change {
    animation: heroStatPop 0.5s ease;
  }
  @keyframes heroStatPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); color: var(--bs-success); }
    100% { transform: scale(1); }
  }
  .hero-demo-event {
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s ease;
  }
  .hero-demo-event.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .hero-demo-pulse {
    animation: heroPulse 2s infinite;
  }
  @keyframes heroPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>

<!-- Config bridge: Liquid values pushed into JS via data attributes -->
<div id="hero-demo-config"
     data-platform="{{ include.platform }}"
     data-action-1="{{ include.action1 | default: 'New follower' }}"
     data-action-2="{{ include.action2 | default: 'New like' }}"
     data-action-3="{{ include.action3 | default: 'Profile view' }}"
     data-action-4="{{ include.action4 | default: 'Gained follower' }}"
     data-action-5="{{ include.action5 | default: 'Post liked' }}"
     data-action-6="{{ include.action6 | default: 'Story viewed' }}"
     hidden></div>

<!-- Hidden icon template for JS to clone -->
<template id="hero-demo-icon-circle-check">{% omega_icon "circle-check", "smaller" %}</template>

<div class="bg-white bg-opacity-10 backdrop-blur rounded-4 shadow-lg overflow-hidden">
  <!-- Header -->
  <div class="d-flex align-items-center gap-2 px-3 py-2 border-bottom border-white border-opacity-10">
    <span class="rounded-circle d-inline-block" style="width:12px;height:12px;background:#ff5f56"></span>
    <span class="rounded-circle d-inline-block" style="width:12px;height:12px;background:#ffbd2e"></span>
    <span class="rounded-circle d-inline-block" style="width:12px;height:12px;background:#27c93f"></span>
    <span class="flex-grow-1 text-center small text-white-50 fw-medium">{{ include.title | default: site.brand.name | append: " Dashboard" }}</span>
  </div>

  <!-- Stats row -->
  <div class="d-flex border-bottom border-white border-opacity-10">
    <div class="flex-fill text-center py-3 border-end border-white border-opacity-10">
      <div class="fs-4 fw-bold text-white" id="hero-demo-stat1">0</div>
      <div class="smaller text-white-50">{{ include.stat1_label | default: "Followers" }}</div>
    </div>
    <div class="flex-fill text-center py-3 border-end border-white border-opacity-10">
      <div class="fs-4 fw-bold text-white" id="hero-demo-stat2">0</div>
      <div class="smaller text-white-50">{{ include.stat2_label | default: "Likes" }}</div>
    </div>
    <div class="flex-fill text-center py-3">
      <div class="fs-4 fw-bold text-white" id="hero-demo-stat3">0</div>
      <div class="smaller text-white-50">{{ include.stat3_label | default: "Views" }}</div>
    </div>
  </div>

  <!-- Live activity feed -->
  <div class="px-3 py-2">
    <div class="d-flex align-items-center gap-2 mb-2">
      <span class="hero-demo-pulse rounded-circle bg-success d-inline-block" style="width:6px;height:6px"></span>
      <span class="smaller text-white-50 fw-medium">Live activity</span>
    </div>
    <div id="hero-demo-feed" style="min-height:140px;overflow:hidden"></div>
  </div>
</div>

<!-- Logic moved to src/assets/js/main.js (initHeroDemo) -->
