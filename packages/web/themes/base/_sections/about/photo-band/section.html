{% if args.items and args.items.size > 0 %}
  <section class="pt-0">
    <div class="container">
      <div class="omega-photo-band" data-omega-reveal-stagger="90">
        {% for photo in args.items %}
          {% if photo.wide %}
            <div class="omega-photo-band__tile omega-photo-band__tile--wide lazy-loading" data-lazy="@bg {{ photo.src | omega_append_param: 'w', 1600 }}" role="img" aria-label="{{ photo.alt }}" data-omega-reveal>
              {% iftruthy photo.caption %}<span class="omega-photo-band__caption">{{ photo.caption }}</span>{% endiftruthy %}
            </div>
          {% else %}
            <figure class="omega-photo-band__tile" data-omega-reveal>
              <img
                src="{{ args.placeholder }}"
                data-lazy="@srcset {{ photo.src | omega_append_param: 'w', 640 }} 640w, {{ photo.src | omega_append_param: 'w', 1080 }} 1080w"
                sizes="(min-width: 992px) 40vw, 100vw"
                alt="{{ photo.alt }}"/>
              {% iftruthy photo.caption %}<figcaption class="omega-photo-band__caption">{{ photo.caption }}</figcaption>{% endiftruthy %}
            </figure>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </section>
{% endif %}
