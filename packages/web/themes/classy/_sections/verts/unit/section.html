<section{% if args.section_class != blank %} class="{{ args.section_class }}"{% endif %} data-omega-section="verts/unit">
  <div class="omega-vert-unit" data-omega-vert="{{ args.type }}"
    {%- if args.size != blank %} data-omega-vert-size="{{ args.size }}"{% endif %}
    {%- if args.vert_id != blank %} data-omega-vert-id="{{ args.vert_id }}"{% endif %}
    {%- if args.tags != blank %} data-omega-vert-tags="{{ args.tags | join: ',' }}"{% endif %}
    data-wm-bind="@hide auth.resolved.active"></div>
</section>
