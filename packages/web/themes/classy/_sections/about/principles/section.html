<section>
  <div class="container">
    <div class="classy-section-head mb-5" data-omega-reveal>
      {% component "heading/section-head", superheadline: args.superheadline.text, headline: args.headline, sub: args.subheadline %}
    </div>

    <div class="classy-numbered" data-omega-reveal-stagger="70">
      {% for value in args.items %}
        <div class="classy-numbered__item" data-omega-reveal>
          <span class="classy-numbered__index">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
          <div class="classy-numbered__title">{{ value.title }}</div>
          <p class="classy-numbered__desc">{{ value.description }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
