---
layout: core/base
pageModule: signup
form:
  submitLabel: "Create account"
---
<section class="auth-page container py-5" data-page="signup">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1>Join {{ site.brand.name }}</h1>
      <form class="auth-form mt-4" data-form-manager="signup">
        <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
        <input type="password" name="confirm" class="form-control mb-3" placeholder="Confirm password" required>
        <button type="submit" class="btn btn-primary w-100">{{ resolved.form.submitLabel }}</button>
      </form>
      <p class="mt-3"><a href="/signin/">Already have an account?</a></p>
    </div>
  </div>
</section>
