---
---

<!DOCTYPE html>
<html
  lang="{{ resolved.config.translation.default |  default: 'en' }}"
  dir="ltr"

  class="{{ resolved.config.theme.html.class }}" {{ resolved.config.theme.html.attributes }}

  data-theme-id="{{ resolved.config.theme.id }}"

  data-bs-theme="{{ resolved.config.theme.appearance }}"

  data-page-path="{{ page.url }}"

  data-environment="{{ jekyll.environment | default: 'development' }}"
  {%- comment -%} #858: a page's own answer to the site's `translation.include`
  list, stamped only when the page states one. The translation pass runs
  post-build over dist/ (and `omega translate` runs with no build at all), so
  the built page is where a frontmatter answer is readable, the same seam the
  base-path stamp uses. {%- endcomment -%}
  {%- if resolved.translation.include == true %} data-omega-translate="true"{% elsif resolved.translation.include == false %} data-omega-translate="false"{% endif %}
  data-platform=""
  data-device=""
  data-runtime=""
  data-browser=""
  data-iframed="false"

  data-page-loading="true"
  aria-busy="true"
  >
  <head>
    <!-- Head -->
    {%- include core/head.html -%}
  </head>

  <body
    class="{{ resolved.config.theme.body.class }}" {{ resolved.config.theme.body.attributes }}
    >

    <!-- Head -->
    {%- include core/body.html -%}

    <!-- Content -->
    {{ content | omega_content_format }}

    <!-- Foot -->
    {%- include core/foot.html -%}
  </body>
</html>
