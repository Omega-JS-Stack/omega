# Ruby-free CI — @omega.js/web replaces the Jekyll pipeline: no Ruby, no
# bundler, no Gemfile. Node + `omega build` is the whole toolchain.
# Regenerated by `omega setup` — customize via config/omega.json5, not here.
name: Compile and Build Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  NODE_VERSION: '{{ versions.node }}'
  NODE_ENV: 'production'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Socket Firewall
        run: npm install -g sfw

      - name: Run node install
        run: |
          for attempt in 1 2 3; do
            echo "Install attempt $attempt of 3 (sfw)..."
            sfw npm install && break
            echo "Attempt $attempt failed"
            if [ "$attempt" -eq 3 ]; then
              echo "⚠ All sfw attempts failed, falling back to plain npm install"
              npm install
            fi
            sleep 15
          done

      - name: Log versions
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Omega: $(npx omega version)"

      - name: Build
        run: |
          npx omega setup && npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./dist
