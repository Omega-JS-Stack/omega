# Deliberate deploys (D13): commits never auto-publish — save = commit,
# publish = an explicit dispatch (`omega deploy`, the CMS publish action, or
# a plain HTTP workflow_dispatch/repository_dispatch call).
name: Build and Publish Extension

on:
  workflow_dispatch:
  repository_dispatch:
    types: [omega-deploy]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '[versions.node]'
  OMEGA_BUILD_MODE: 'true'
  OMEGA_IS_PUBLISH: 'true'

  # Every CI-delivered key of the env schema, GENERATED (#627): one
  # `KEY: ${{ secrets.KEY }}` line per `delivery: { extension: 'ci' | 'bake' }`
  # entry (@omega.js/config's env-delivery.js), re-rendered by every verb's
  # scaffold. A dispatched run has no `.env`, so this block is the ONLY way the
  # store credentials and the Measurement Protocol secret the build bakes into
  # build.js reach the runner. Add a key to the schema, not to this file.
  [ githubSecrets ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup git config
        run: |
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git config --global user.name "$GITHUB_ACTOR"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Socket Firewall
        run: npm install -g sfw

      - name: Install dependencies
        run: sfw npm install

      - name: Log dependency versions
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Framework: $(npx omega-extension version)"
          echo ""
          echo "NPM Dependencies:"
          npm list --depth=0 || echo ""

      - name: Build and publish extension
        run: |
          npm run build

      # Artifact channel = GitHub releases (D9 addendum 2) — the same channel
      # desktop distributes from, and where CMS download links point. Store
      # uploads happen in the build step when credentials are present; the zips
      # here are the durable, downloadable fallback for manual store uploads.
      # The build writes one per browser target (packaged/<target>/extension.zip);
      # a release asset is named by its basename, so each is copied to a
      # target-stamped name before upload instead of clobbering the others.
      - name: Upload packages to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="extension-v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Extension v$VERSION" --notes "Browser extension package for v$VERSION (built from ${{ github.sha }})."
          for zip in packaged/*/extension.zip; do
            target=$(basename "$(dirname "$zip")")
            cp "$zip" "packaged/extension-$target.zip"
            gh release upload "$TAG" "packaged/extension-$target.zip" --clobber
          done
