name: Build & Release

# Manual-trigger only — releases are intentional, not a side effect of every commit.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated). Examples: all, windows, mac,linux'
        required: false
        default: 'all'
        type: string

env:
  NODE_VERSION: '{{ versions.node }}'
  OMEGA_BUILD_MODE: 'true'
  OMEGA_IS_PUBLISH: 'true'
  OMEGA_IS_SERVER:  'true'
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  # Every CI-delivered key of the env schema, GENERATED (#627): one
  # `KEY: ${{ secrets.KEY }}` line per `delivery: { desktop: 'ci' | 'bake' }`
  # entry (@omega.js/config's env-delivery.js), re-rendered by every verb's
  # ensureTarget. Signing, notarization, store and analytics credentials all
  # arrive here, workflow-wide — the jobs and steps below consume them without
  # restating one. Add a key to the schema, not to this file.
  {{ githubSecrets }}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve which platforms to build from the workflow_dispatch `platforms` input.
  # Outputs a JSON matrix (consumed by the build job) plus per-platform booleans
  # (consumed by windows-strategy / windows-sign gating). When `platforms` is
  # omitted (older invocations) the input defaults to 'all'.
  setup:
    name: Setup (resolve target platforms)
    runs-on: ubuntu-latest
    outputs:
      matrix:  ${{ steps.resolve.outputs.matrix }}
      mac:     ${{ steps.resolve.outputs.mac }}
      windows: ${{ steps.resolve.outputs.windows }}
      linux:   ${{ steps.resolve.outputs.linux }}
    steps:
      - id: resolve
        run: |
          input="${{ github.event.inputs.platforms || 'all' }}"
          input="$(echo "$input" | tr '[:upper:]' '[:lower:]')"

          mac=false; win=false; linux=false
          if [[ "$input" == *all* ]]; then mac=true; win=true; linux=true; fi
          if [[ "$input" == *mac* ]] || [[ "$input" == *darwin* ]]; then mac=true; fi
          if [[ "$input" == *win* ]]; then win=true; fi
          if [[ "$input" == *linux* ]] || [[ "$input" == *ubuntu* ]]; then linux=true; fi

          entries=()
          $mac   && entries+=('"macos-latest"')
          $win   && entries+=('"windows-latest"')
          $linux && entries+=('"ubuntu-latest"')
          if [ ${#entries[@]} -eq 0 ]; then
            echo "Error: '$input' did not match any platform. Use: all | mac | windows | linux | comma-separated combos." >&2
            exit 1
          fi

          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "Resolved input='$input' → mac=$mac, win=$win, linux=$linux, matrix=$matrix"

          echo "matrix=$matrix"  >> "$GITHUB_OUTPUT"
          echo "mac=$mac"        >> "$GITHUB_OUTPUT"
          echo "windows=$win"    >> "$GITHUB_OUTPUT"
          echo "linux=$linux"    >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The workflow's own token: a checkout never needs the release PAT, and a
      # bad PAT then fails at the release step with an API error, not here with
      # git asking for a username.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Socket Firewall
        run: npm install -g sfw

      # On Windows, force cmd for every shell step in this job — the runner's default
      # is PowerShell 7 which has its own ExecutionPolicy/wrapping quirks that cause
      # `npm ci` and similar to exit silently with no captured output. cmd has none
      # of that. mac/linux use their default bash regardless of this flag (per
      # actions/runner shell-resolution: `cmd` is win-only and ignored elsewhere).
      - if: matrix.os == 'windows-latest'
        shell: cmd
        run: sfw npm ci
      - if: matrix.os != 'windows-latest'
        run: sfw npm ci

      # macOS — decode signing assets from secrets, then sign + notarize + publish.
      # `npx omega push-secrets` uploads .p12 / .p8 files as base64-encoded secrets;
      # the workflow decodes them back to disk for electron-builder + notarytool to read.
      - if: matrix.os == 'macos-latest'
        run: |
          mkdir -p config/certs
          echo "${{ secrets.CSC_LINK }}"      | base64 --decode > config/certs/dev-id.p12
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > config/certs/AuthKey.p8
      # The two file-path OVERRIDES of the workflow env: electron-builder and
      # notarytool read these as paths, and the step above just decoded the
      # base64 secrets of the same name to disk. Every other credential comes
      # from the generated env block.
      - if: matrix.os == 'macos-latest'
        env:
          CSC_LINK:         config/certs/dev-id.p12
          APPLE_API_KEY:    config/certs/AuthKey.p8
        run: npm run release:local

      # Linux — install snapcraft when (a) the consumer hasn't explicitly disabled snap
      # in their config (`platforms.linux.snap.enabled !== false`; default is true) AND
      # (b) SNAPCRAFT_STORE_CREDENTIALS is set as a repo secret. Without the secret we
      # skip snapcraft install entirely — build-config.js auto-skips the snap target on
      # the same condition, so the build still produces .deb + .AppImage cleanly with
      # no snap publish attempt and no failure.
      - name: Install Snapcraft (Linux, when snap enabled + creds present)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # (a) Config check — explicit `enabled: false` opts out; missing/true opts in.
          # `@omega.js/desktop/config` is the vendored @omega.js/config loader — resolves
          # config/omega.json5 for the desktop target (brand-monorepo aware).
          if node -e 'const c = require("@omega.js/desktop/config").loadConfig(process.cwd(), "desktop").config; process.exit(c.platforms?.linux?.snap?.enabled === false ? 1 : 0);'; then
            CONFIG_OK=1
          else
            CONFIG_OK=0
            echo "platforms.linux.snap.enabled === false — skipping snapcraft install."
          fi
          # (b) Credentials check — empty secret means no publish creds available.
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            CREDS_OK=1
          else
            CREDS_OK=0
            echo "SNAPCRAFT_STORE_CREDENTIALS not set — skipping snapcraft install. Run 'snapcraft export-login -' and add the blob to .env, then 'mgr push-secrets'."
          fi
          if [ "$CONFIG_OK" = 1 ] && [ "$CREDS_OK" = 1 ]; then
            sudo snap install snapcraft --classic
            echo "Snapcraft installed."
          fi

      # Linux — no signing
      - if: matrix.os == 'ubuntu-latest'
        run: npm run release:local

      # Windows — package (build + electron-builder package) unsigned. We do NOT publish
      # here. Mac/linux's `npm run release:local` step already created the GH Release via
      # electron-builder publish; windows-sign uploads signed .exe to that same release.
      # shell: cmd as above — PowerShell 7's wrapping breaks long-running npm scripts.
      - if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          OMEGA_SKIP_WIN_SIGN: 'true'
          # The workflow env carries the mac signing cert (CSC_LINK is the
          # base64 .p12 the mac job decodes); electron-builder would otherwise
          # try to sign the Windows build with it. Empty reads as UNSET — the
          # build's sanitize pass drops it — so this step packages unsigned, as
          # it always did. windows-sign signs separately.
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
        run: npm run package

      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          # Capture installer + auto-updater feed + blockmap so windows-sign can re-upload them all.
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

  # Resolve the signing strategy from config/omega.json5. We do this in a tiny job
  # (just runs node + the vendored config loader) so downstream jobs can gate on the result.
  # Single source of truth = the consumer's config file; workflow doesn't duplicate the value.
  windows-strategy:
    name: Resolve Windows signing strategy
    needs: [setup, build]
    if: needs.setup.outputs.windows == 'true'
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.resolve.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g sfw
      - run: sfw npm ci
      - id: resolve
        run: |
          STRATEGY=$(node -e "const c=require('@omega.js/desktop/config').loadConfig(process.cwd(),'desktop').config;console.log(c.platforms?.win?.signing?.strategy || 'self-hosted');")
          echo "strategy=$STRATEGY" >> "$GITHUB_OUTPUT"
          echo "Resolved Windows signing strategy: $STRATEGY"

  windows-sign:
    name: Sign Windows
    needs: [setup, build, windows-strategy]
    # Strategy comes from config platforms.win.signing.strategy (read by windows-strategy job).
    #   self-hosted (default) — runs on a self-hosted runner with EV USB token attached
    #   cloud                 — runs on hosted windows-latest, calls cloud signing provider
    #   local                 — skip this job; sign locally via `npx omega sign-windows`
    if: needs.setup.outputs.windows == 'true' && needs.windows-strategy.outputs.strategy != 'local'
    runs-on: ${{ needs.windows-strategy.outputs.strategy == 'cloud' && fromJSON('["windows-latest"]') || fromJSON('["self-hosted","windows","ev-token"]') }}
    # Signing is ~20s per installer. A job still running much later is waiting on
    # something that never comes (a PIN at a locked console); end it instead of
    # holding the self-hosted runner for GitHub's six-hour default.
    timeout-minutes: 30
    # Use cmd.exe (not PowerShell) on Windows. Self-hosted runners often have PowerShell
    # ExecutionPolicy set to Restricted, which blocks the Actions-generated wrapper .ps1
    # scripts that GH spits out for every `run:` step. cmd.exe has no such restriction
    # and runs the same `npm ci` / `npx ...` commands fine.
    defaults:
      run:
        shell: cmd
    # Signing credentials — self-hosted EV USB token (WIN_EV_TOKEN_PATH,
    # WIN_CSC_KEY_PASSWORD, SIGNTOOL_PATH) and the cloud providers (only the set
    # `platforms.win.signing.cloud.provider` names is consumed) — all arrive
    # through the workflow's generated env block. Set them in the brand .env and
    # push with `npx omega push-secrets`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g sfw
      - run: sfw npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: release
      - run: npx omega sign-windows --in release --out release/signed
      # Upload the SIGNED Windows assets to the release the mac/linux electron-builder
      # publish step already created in the brand's public releases repo. The asset
      # names carry no version, so nothing is mirrored anywhere.
      - run: npx omega finalize-release --signed-dir release/signed

  finalize:
    name: Finalize release
    # Run after every required job. windows-sign is skipped when strategy=local OR when
    # `inputs.platforms` excludes windows; this job still runs and just won't flip the
    # release to published in those cases (see step gate below).
    # `always()` lets a failed or skipped job reach this `if`, which is why the
    # build's result is named rather than left to the default success gate.
    needs: [setup, build, windows-sign]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g sfw
      - run: sfw npm ci
      # Flip the releases-repo release from Draft to Published so electron-updater
      # can read it. Idempotent — safe to run even if already published. ONLY runs
      # on all-platforms builds: a partial run (e.g. `--platforms windows`) leaves
      # the release as a draft, so subsequent runs can fill in the missing platform
      # assets before electron-updater starts seeing the version.
      - if: needs.setup.outputs.mac == 'true' && needs.setup.outputs.linux == 'true' && needs.setup.outputs.windows == 'true'
        run: npx omega finalize-release --publish
      - if: needs.setup.outputs.mac != 'true' || needs.setup.outputs.linux != 'true' || needs.setup.outputs.windows != 'true'
        run: echo "Partial-platform run (mac=${{ needs.setup.outputs.mac }} linux=${{ needs.setup.outputs.linux }} windows=${{ needs.setup.outputs.windows }}) — leaving release as draft. Run with --platforms all to publish."
